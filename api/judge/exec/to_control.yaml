openapi: "3.0.3"
info:
  title: exec to control API
  version: "0.1"
  license:
    name: MIT
    url: "https://github.com/traP-jp/traO-Judge-docs/blob/main/LICENSE"
servers:
  - url: https://api.server.test/v1
paths:
  "/execute":
    post:
      operationId: execute
      description: control container から file placed message を受け取り，ジャッジの実行を開始する．
      tags:
        - judge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePlacedMessage"
        required: true
      summary: ジャッジの実行を開始
      responses:
        "202":
          description: |-
            Accepted
            ジャッジの実行が開始されました．
        "400":
          description: Bad Request
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    File:
      title: File
      type: object
      description: ファイル
      properties:
        fileId:
          title: fileId
          type: string
          description: ファイルの UUID
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        filePath:
          title: filePath
          type: string
          description: ファイルのパス
          example: "/path/to/file"
      required:
        - fileId
        - filePath
    FilePlacedMessage:
      title: FilePlacedMessage
      type: object
      description: ジャッジの実行を開始するトリガーとなるメッセージ
      properties:
        cmd:
          title: cmd
          type: string
          description: コマンド
          example: cmd
        envs:
          title: envs
          type: object
          description: 環境たち
          additionalProperties:
            title: env
            type: string
            description: 環境
            example: env
        connectionTimeLimit:
          title: connectionTimeLimit
          type: integer
          description: 接続時間制限
          example: 20000
        executionTimeLimit:
          title: executionTimeLimit
          type: integer
          description: 実行時間制限
          example: 2000
        readonlyFiles:
          title: readonlyFiles
          type: array
          description: ジャッジに使用するファイル（読み取り専用）
          items:
            $ref: "#/components/schemas/File"
        writableFiles:
          title: writableFiles
          type: array
          description: ジャッジに使用するファイル（書き込み可能）
          items:
            $ref: "#/components/schemas/File"
      required:
        - cmd
        - envs
        - connectionTimeLimit
        - executionTimeLimit
        - readonlyFiles
        - writableFiles
